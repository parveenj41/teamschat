<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
<link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
<title>TeamsChat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">TC</div>
      <span>TeamsChat</span>
    </div>
    <h1>Create your account</h1>
    <p class="subtitle">It only takes a minute</p>

    <div id="alertBox"></div>

    <form id="signupForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name" placeholder="Jane Doe" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Sign up</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="index.html">Log in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getSession()) window.location.href = 'dashboard.html';

    const form = document.getElementById('signupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await apiRequest('/api/auth/signup', {
          method: 'POST',
          body: { name, email, password }
        });
        saveSession(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign up';
      }
    });
  </script>
</body>
</html>
