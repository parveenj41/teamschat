<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
<link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
<title>TeamsChat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">TC</div>
      <span>TeamsChat</span>
    </div>
    <h1>Set a new password</h1>
    <p class="subtitle">Choose a new password for your account</p>

    <div id="alertBox"></div>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Re-enter password" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Reset password</button>
    </form>

    <p class="auth-footer">
      <a href="index.html">Back to log in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    if (!token || !email) {
      showAlert('This reset link is missing information. Please request a new one.');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Passwords do not match');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const data = await apiRequest('/api/auth/reset-password', {
          method: 'POST',
          body: { email, token, newPassword: password }
        });
        showAlert(data.message + ' Redirecting to log in...', 'success');
        setTimeout(() => (window.location.href = 'index.html'), 1800);
      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
