<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
<link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
<title>TeamsChat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">TC</div>
      <span>TeamsChat</span>
    </div>
    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link</p>

    <div id="alertBox"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
    </form>

    <p class="auth-footer">
      <a href="index.html">Back to log in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const email = document.getElementById('email').value.trim();
        const data = await apiRequest('/api/auth/forgot-password', {
          method: 'POST',
          body: { email }
        });

        let msg = data.message;
        // devResetUrl is only returned when email sending isn't configured yet (for local testing)
        if (data.devResetUrl) {
          msg += `<br><br><strong>Email is not configured yet — dev link:</strong><br><a href="${data.devResetUrl}">${data.devResetUrl}</a>`;
        }
        showAlert(msg, 'success');
        submitBtn.textContent = 'Link sent';
      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
