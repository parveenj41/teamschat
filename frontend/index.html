<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
<link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
<title>TeamsChat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">TC</div>
      <span>TeamsChat</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue to your groups</p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
    </form>

    <p class="auth-footer">
      <a href="forgot-password.html">Forgot password?</a>
    </p>
    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in, skip straight to the dashboard
    if (getSession()) window.location.href = 'dashboard.html';

    // Show a friendly notice if we were redirected here because the
    // session/token expired, instead of silently dropping the user on the
    // login page with no explanation.
    if (new URLSearchParams(window.location.search).get('sessionExpired')) {
      document.getElementById('alertBox').innerHTML =
        `<div class="alert alert-error">Your session expired. Please log in again.</div>`;
    }

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await apiRequest('/api/auth/login', {
          method: 'POST',
          body: { email, password }
        });
        saveSession(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
